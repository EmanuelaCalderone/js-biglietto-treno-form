<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./css/style.css" type="text/css">
    <title>Biglietti treno</title>
</head>
<body>
    
    <!--form-->
    <form action="#">

        <!--campo età-->
        <label for="età">Età</label>
        <input type="text" id="eta_field" placeholder="Inserisci la tua età">

        <!--campo km-->
        <label for="Chilometri">Quanti km percorrerai?</label>
        <input type="number" id="km_field" placeholder="Inserisci i km">

        <!--pulsante invia-->
        <input type="submit" value="Calcola" id="invia">
    </form>

    <!--biglietto-->
    <div id="biglietto">
        <p>Età: <span id="eta_utente"></span></p>
        <p>Chilometri: <span id="chilometri_utente"></span></p>
        <p>Costo biglietto: <span id="costo_biglietto"></span></p>
    </div>


    <script src="./js/script.js"></script>
</body>
</html>
